      // GitHub Pages SPA fallback, restore half: 404.html stashes the attempted
      // deep link in sessionStorage; we restore it before the router boots.
      // Harmless on the droplet deploy (nothing ever sets ghp-redirect there).

      if (r) {
        sessionStorage.removeItem('ghp-redirect')
        history.replaceState(null, '', r)
      }
